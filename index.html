    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/MobiGuard/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/MobiGuard/icon.svg" />
    <link rel="apple-touch-icon" href="/MobiGuard/apple-touch-icon.png" />
    <title>MobiGuard — Check before you trust</title>
    <meta name="description" content="Privacy-focused AI mobile security assistant that helps users identify scams, phishing, fraudulent messages, suspicious links, and social-engineering attempts." />
    <meta property="og:title" content="MobiGuard — Check before you trust" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body {
        background-color: #020617;
        margin: 0;
        padding: 0;
        min-height: 100%;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      #root { min-height: 100vh; }
      .mobiguard-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        color: #94a3b8;
        padding: 24px;
        box-sizing: border-box;
      }
      .mobiguard-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(6, 182, 212, 0.2);
        border-top-color: #06b6d4;
        border-radius: 50%;
        animation: mobiguard-spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes mobiguard-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body style="background-color: #020617;">
    <div id="root">
      <div class="mobiguard-preloader">
        <div class="mobiguard-spinner"></div>
        <div style="font-weight: 700; font-size: 16px; color: #f8fafc; letter-spacing: 0.5px; margin-bottom: 6px;">
          MobiGuard
        </div>
        <div style="font-size: 11px; color: #64748b; font-family: monospace;">

        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
