<!doctype html>
<html lang="en" style="background-color: #020617; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/MobiGuard/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/MobiGuard/icon.svg" />
    <link rel="apple-touch-icon" href="/MobiGuard/apple-touch-icon.png" />
    <title>MobiGuard — Check before you trust</title>
    <meta name="description" content="Privacy-focused AI mobile security assistant that helps users identify scams, phishing, fraudulent messages, suspicious links, and social-engineering attempts." />
    <meta property="og:title" content="MobiGuard — Check before you trust" />
    <meta property="og:description" content="Privacy-focused AI mobile security assistant that helps users identify scams, phishing, fraudulent messages, suspicious links, and social-engineering attempts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body {
        background-color: #020617;
        margin: 0;
        padding: 0;
        min-height: 100%;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      #root { min-height: 100vh; }
      .mobiguard-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        color: #94a3b8;
        padding: 24px;
        box-sizing: border-box;
      }
      .mobiguard-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(6, 182, 212, 0.2);
        border-top-color: #06b6d4;
        border-radius: 50%;
        animation: mobiguard-spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes mobiguard-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body style="background-color: #020617;">
    <div id="root">
      <div class="mobiguard-preloader">
        <div class="mobiguard-spinner"></div>
        <div style="font-weight: 700; font-size: 16px; color: #f8fafc; letter-spacing: 0.5px; margin-bottom: 6px;">
          MobiGuard
        </div>
        <div id="loader-status" style="font-size: 11px; color: #64748b; font-family: monospace;">
          Loading security dashboard...
        </div>
      </div>
    </div>
    <script>
      // Failsafe 1: Update status to Browser Demo Mode if loading takes > 800ms
      setTimeout(function() {
        var status = document.getElementById('loader-status');
        if (status) {
          status.innerHTML = '<span style="color: #f59e0b; font-weight: 600;">Browser Demo Mode — Local AI unavailable</span>';
        }
      }, 800);

      // Failsafe 2: Provide manual launch if browser script execution is delayed
      setTimeout(function() {
        var preloader = document.querySelector('.mobiguard-preloader');
        if (preloader && !document.getElementById('manual-launch-btn')) {
          var btn = document.createElement('button');
          btn.id = 'manual-launch-btn';
          btn.innerText = 'Launch MobiGuard Dashboard';
          btn.style.cssText = 'margin-top: 16px; padding: 8px 16px; font-size: 12px; font-weight: 600; color: #020617; background: #06b6d4; border: none; border-radius: 8px; cursor: pointer;';
          btn.onclick = function() { window.location.reload(); };
          preloader.appendChild(btn);
        }
      }, 2500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
